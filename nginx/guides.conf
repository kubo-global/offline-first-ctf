# The guides site: the pack's tutorials at /, the offline copy of CyberChef at /cyberchef/.
server {
    listen 80;
    server_name _;
    # redirects keep the port the player used (8080), not port 80
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location /cyberchef/ {
        alias /usr/share/nginx/cyberchef/;
        index index.html;
    }
    location = /cyberchef {
        return 301 /cyberchef/;
    }
}
